---

# Available Jinja2 variables:
# ---------------------------
# * {{ php_all_versions }}:  Array of all PHP versions


all:
  type: git
  git_url: https://github.com/kjdev/php-ext-lz4
  flags: |
    --depth=1 --single-branch --branch=$(git ls-remote --tags https://github.com/kjdev/php-ext-lz4 \
      | sed 's/^.*tags\///g' \
      | grep -E '^[.0-9]+$' \
      | tr '-' '~' | sort -V | tail -1 \
    ) \
  configure: --enable-lz4 --with-lz4-includedir=/usr
  build_dep: [liblz4-dev]
  run_dep: [liblz4-1]

# PHP 8.0's gen_stub.php cannot parse lz4.stub.php (global const); keep the shipped arginfo
8.0:
  type: git
  git_url: https://github.com/kjdev/php-ext-lz4
  command: |
    touch lz4_arginfo.h \
    && phpize \
    && ./configure --enable-lz4 --with-lz4-includedir=/usr \
    && make -j$(getconf _NPROCESSORS_ONLN) \
    && make install \
