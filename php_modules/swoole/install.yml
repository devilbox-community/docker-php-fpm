---

# Available Jinja2 variables:
# ---------------------------
# * {{ php_all_versions }}:  Array of all PHP versions

# TODO: Fixed enable-swoole-curl
all:
  type: pecl
  # Note: -D is only supported from PHP 7.2+
  command: pecl install -D 'enable-sockets="no" enable-mysqlnd="yes" enable-swoole-curl="yes" enable-cares="yes" enable-brotli="yes" enable-swoole-pgsql="yes"' swoole
  build_dep: [libc-ares-dev, libnghttp2-dev, libssl-dev, libcurl4-openssl-dev, libbrotli-dev, libpq-dev]
  run_dep: [libc-ares2, libnghttp2-14, libbrotli1, libpq5]

8.1:
  type: pecl
  # swoole >= 6.2 requires PHP >= 8.2; 6.1.x still needs enable-openssl (6.2 always builds it)
  command: pecl install -D 'enable-sockets="no" enable-openssl="yes" enable-mysqlnd="yes" enable-swoole-curl="yes" enable-cares="yes" enable-brotli="yes" enable-swoole-pgsql="yes"' swoole-6.1.11

8.0:
  type: pecl
  version: 5.1.7

7.4:
  type: pecl
  version: 4.8.13

7.3:
  type: pecl
  version: 4.8.13

